# Production-style stack for a single Lightsail instance (docs/DEPLOYMENT.md).
# Local development uses a native PostgreSQL + PostGIS instead; only `db` is useful locally.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: milkore
      POSTGRES_USER: milkore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milkore -d milkore"]
      interval: 10s
      retries: 5
    # Not published to the internet; the API reaches it on the compose network.

  api:
    image: ${API_IMAGE:-ghcr.io/arvind3690/milkore_backend:latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://milkore:${POSTGRES_PASSWORD}@db:5432/milkore
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: ${API_IMAGE:-ghcr.io/arvind3690/milkore_backend:latest}
    profiles: ["ops"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://milkore:${POSTGRES_PASSWORD}@db:5432/milkore
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

volumes:
  pgdata:
  caddy_data:
