name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: milkore
          POSTGRES_PASSWORD: milkore
          POSTGRES_DB: milkore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U milkore" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # setup-env.ts appends `_test` unless the name already ends with it.
      DATABASE_URL: postgresql://milkore:milkore@localhost:5432/milkore_test
      JWT_SECRET: ci-only-jwt-secret-0123456789
      REFRESH_TOKEN_PEPPER: ci-only-refresh-pepper-0123456789
      ADMIN_JWT_SECRET: ci-only-admin-secret-0123456789
      OTP_HMAC_SECRET: ci-only-otp-secret-0123456789
      SEED_ADMIN_EMAIL: admin@ci.local
      SEED_ADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - name: Migrate and seed test database
        run: npx prisma migrate deploy && npx ts-node prisma/seed.ts
      - run: npm run test:e2e
      - run: npm run build

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
